<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Slide Maker</title>
    <style>
        body {
            margin: 50px;
        }

        .container {
            display: flex;
        }

        #firstheading {
            text-align: center;
        }

        .box1 {
            width: 50%;
            border-radius: 20px;
            margin-right: 50px;
            padding: 20px;
            border: solid black 2px;
        }

        .box2 {
            width: 50%;
            border-radius: 20px;
            padding: 20px;
            border: solid black 2px;
        }

        .slide {
            background: rgb(199, 199, 199);

            padding: 20px;
            border-radius: 10px;
        }

        textarea {
            border: none;
        }

        .slide:fullscreen {
            background: rgb(199, 199, 199);
            color: black;
            width: 100%;
            height: 100%;
            padding: 60px;
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        button {
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1 id="firstheading">Markdown Slide Maker</h1>

    <div class="container">

        <div class="box1">
            <h2>Markdown Editor</h2>
            <textarea placeholder="Write your Markdown here..." id="markdownInput"></textarea>
        </div>

        <div class="box2">
            <h2>Slide Preview</h2>
            <div class="slide" id="slidePreview">
                <h1>My First Slide</h1>
                <p>Your slide will appear here.</p>
            </div>
            <button id="prevBtn">Previous</button>
            <button id="nextBtn">Next</button>
            <button id="presentBtn">Presentation Mode</button>
            <p id="slideCounter">Slide 1</p>
        </div>

    </div>

    <script>


        const editor = document.getElementById("markdownInput");
        const preview = document.getElementById("slidePreview");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const counter = document.getElementById("slideCounter");
        const presentBtn = document.getElementById("presentBtn");

        let slides = [];
        let currentSlide = 0;

        const savedMarkdown = localStorage.getItem("savedMarkdown");

        if (savedMarkdown !== null) {
            editor.value = savedMarkdown;
        } else {
            editor.value = `# First Slide

Welcome to my presentation.

---

## My Second Slide

This is the second slide.

---

### Third Slide

Thank you!`;
        }

        function markdownToHTML(markdown) {
            const escapeHTML = (text) => text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

            return markdown
                .trim()
                .split("\n")
                .map(line => {
                    const text = escapeHTML(line.trim());

                    if (text.startsWith("### ")) {
                        return `<h3>${text.slice(4)}</h3>`;
                    }

                    if (text.startsWith("## ")) {
                        return `<h2>${text.slice(3)}</h2>`;
                    }

                    if (text.startsWith("# ")) {
                        return `<h1>${text.slice(2)}</h1>`;
                    }

                    if (text === "") {
                        return "";
                    }

                    return `<p>${text}</p>`;
                })
                .join("");
        }

        function updateSlides() {
            slides = editor.value.split(/^\s*---\s*$/m);

            if (currentSlide >= slides.length) {
                currentSlide = Math.max(0, slides.length - 1);
            }

            showSlide();
        }

        function showSlide() {
            const markdown = slides[currentSlide] || "";

            preview.innerHTML = markdownToHTML(markdown);

            counter.textContent =
                `Slide ${currentSlide + 1} of ${slides.length}`;

            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slides.length - 1;
        }

        editor.addEventListener("input", function () {
            localStorage.setItem("savedMarkdown", editor.value);

            currentSlide = 0;
            updateSlides();
        });

        nextBtn.addEventListener("click", function () {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                showSlide();
            }
        });

        prevBtn.addEventListener("click", function () {
            if (currentSlide > 0) {
                currentSlide--;
                showSlide();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (
                document.activeElement === editor &&
                event.key !== "Escape"
            ) {
                return;
            }

            if (event.key === "ArrowRight") {
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                    showSlide();
                }
            }

            if (event.key === "ArrowLeft") {
                if (currentSlide > 0) {
                    currentSlide--;
                    showSlide();
                }
            }

            if (event.key === "Escape" && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        presentBtn.addEventListener("click", async function () {
            try {
                if (!document.fullscreenElement) {
                    await preview.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.error("Unable to enter presentation mode:", error);
            }
        });
        updateSlides();

    </script>

</body>

</html>
